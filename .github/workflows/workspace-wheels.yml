name: Workspace fork wheels

on:
  push:
    tags:
      - 'workspace-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
            manylinux: auto
          - runner: ubuntu-22.04-arm
            target: aarch64
            manylinux: auto
          - runner: macos-15-intel
            target: x86_64
            manylinux: auto
          - runner: macos-15
            target: aarch64
            manylinux: auto
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter python3.12
          sccache: 'true'
      - name: Test installed wheel
        run: |
          python -m pip install dist/*.whl pytest pytest-mock tomli
          python -m pytest -p no:tach python/tests/test_workspace_modules.py python/tests/test_version.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish immutable fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          gh release create "$TAG" *.whl SHA256SUMS --verify-tag --title "$TAG" --notes "Workspace boundary enforcement fork. Source commit: $COMMIT. Wheels tested on Linux and macOS, x86_64 and arm64."
